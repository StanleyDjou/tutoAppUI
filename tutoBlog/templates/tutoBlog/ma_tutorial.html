{% extends "tutoBlog/app.html" %}
{% load static %}

{% block title %}Schulung{% endblock %}

{% block content %}
  <p class="preview-flag" id="preview-flag" hidden>Vorschau · so sehen Mitarbeitende diese Schulung.</p>
  <div class="player-top">
    <a class="back-link" id="back-link" href="{% url 'tutoBlog:ma-dashboard' %}"><i class="bi bi-arrow-left"></i> Zurück</a>
    <div class="player-progress" aria-hidden="true"><span id="player-bar"></span></div>
    <span id="step-label"></span>
  </div>
  <p class="eyebrow" id="player-kicker"></p>
  <h1 class="page-title mb-3" id="player-title"></h1>
  <div class="player-grid">
    <div id="rail-wrap"><ol class="rail" id="rail"></ol></div>
    <div>
      <article class="stage" id="stage"></article>
      <div class="player-nav">
        <button class="btn btn-outline-green" id="prev" type="button"><i class="bi bi-arrow-left"></i> Zurück</button>
        <button class="btn btn-green" id="next" type="button">Weiter <i class="bi bi-arrow-right"></i></button>
      </div>
    </div>
  </div>
{% endblock %}

{% block page_js %}
  <script src="{% static 'tutoBlog/js/player.js' %}"></script>
  <script>PlayerPage.init();</script>
{% endblock %}
